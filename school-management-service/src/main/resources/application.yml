spring:
  application:
    name: schoolsaas-backend
  profiles:
    active: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/school_saas}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
        multiTenancy: SCHEMA
        multi_tenant_connection_provider: com.schoolsaas.config.multitenancy.SchemaMultiTenantConnectionProvider
        tenant_identifier_resolver: com.schoolsaas.config.multitenancy.TenantIdentifierResolver
  flyway:
    enabled: true
    locations: classpath:db/migration/public
    schemas: public
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: 3600000 # 1h
    refresh-token-expiration: 604800000 # 7j
  sms:
    provider: ${SMS_PROVIDER:logging}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local:
      base-path: ${LOCAL_STORAGE_PATH:./uploads}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  show-actuator: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

server:
  port: 8080
